<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設備掃描借還系統</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background-color: #f8f9fa; }
    .card { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #333; }
    
    .nav-bar { display: flex; justify-content: space-around; background: #e9ecef; padding: 8px; border-radius: 8px; margin-bottom: 20px; }
    .nav-link { text-decoration: none; color: #495057; font-weight: bold; padding: 8px 16px; border-radius: 6px; }
    .nav-link.active { background: #0d6efd; color: white; }

    .mode-switch { display: flex; gap: 10px; margin-bottom: 15px; }
    .mode-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: 2px solid #0d6efd; border-radius: 8px; background: white; color: #0d6efd; cursor: pointer; transition: 0.2s; }
    .mode-btn.active-borrow { background: #0d6efd; color: white; }
    .mode-btn.active-return { background: #198754; border-color: #198754; color: white; }

    #camera-select { margin-bottom: 15px; padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 100%; }
    #reader { width: 100%; background: black; border-radius: 8px; overflow: hidden; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; white-space: pre-wrap; line-height: 1.5; min-height: 60px; padding: 10px; border-radius: 6px; background: #f1f3f5; }
  </style>
</head>
<body>

<div class="card">
  <h2>📷 設備掃描借還系統</h2>

  <div class="nav-bar">
    <a href="?page=index" target="_top" class="nav-link active">📷 掃描借還</a>
    <a href="?page=list" target="_top" class="nav-link">📋 借出中清單</a>
  </div>

  <div class="mode-switch">
    <button id="btn-borrow" class="mode-btn active-borrow" onclick="setMode('borrow')">📤 設備借用</button>
    <button id="btn-return" class="mode-btn" onclick="setMode('return')">📥 設備歸還</button>
  </div>

  <select id="camera-select"></select>
  <div id="reader"></div>
  <div id="result">相機啟動中，請稍候...</div>
</div>

<script>
  const API_URL = window.location.href.split('?')[0];

  let currentMode = 'borrow';
  let isProcessing = false;
  let html5QrCode = null;
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };
  const cameraSelect = document.getElementById('camera-select');
  const resultDiv = document.getElementById('result');

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-borrow').className = mode === 'borrow' ? 'mode-btn active-borrow' : 'mode-btn';
    document.getElementById('btn-return').className = mode === 'return' ? 'mode-btn active-return' : 'mode-btn';
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    if (decodedText.includes("text=")) {
      decodedText = decodedText.split("text=")[1].split("&")[0];
    }

    const actionText = currentMode === 'borrow' ? '借用' : '歸還';
    resultDiv.style.color = "#0056b3";
    resultDiv.innerText = `讀取到編號：${decodedText}\n正在處理${actionText}中...`;

    fetch(`${API_URL}?id=${encodeURIComponent(decodedText)}&action=${currentMode}`)
      .then(response => response.text())
      .then(text => {
        resultDiv.style.color = text.includes("成功") ? "green" : "red";
        resultDiv.innerText = text;

        setTimeout(() => {
          isProcessing = false;
          resultDiv.style.color = "#333";
          resultDiv.innerText = "請對準下一個 QR Code 進行掃描...";
        }, 3500);
      })
      .catch(() => {
        resultDiv.style.color = "red";
        resultDiv.innerText = "系統連線錯誤！";
        setTimeout(() => { isProcessing = false; }, 3500);
      });
  }

  function startCamera(cameraId) {
    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(cameraId, config, onScanSuccess)
      .then(() => { resultDiv.innerText = "請對準 QR Code 進行掃描..."; })
      .catch(err => console.error(err));
  }

  Html5Qrcode.getCameras().then(devices => {
    if (devices && devices.length) {
      devices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.id;
        option.text = device.label || `相機 ${index + 1}`;
        cameraSelect.appendChild(option);
      });

      startCamera(cameraSelect.value);
      cameraSelect.addEventListener('change', () => {
        html5QrCode.stop().then(() => startCamera(cameraSelect.value));
      });
    }
  }).catch(() => {
    resultDiv.innerText = "無法取得相機權限，請確認瀏覽器授權。";
  });
</script>

</body>
</html>
