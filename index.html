<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設備掃描借還系統</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background-color: #f8f9fa; }
    .card { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); position: relative; }
    h2 { margin-top: 0; color: #333; }
    
    /* 頂部導覽功能鍵 */
    .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .nav-btn { padding: 8px 14px; font-size: 14px; font-weight: bold; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .nav-btn:hover { background: #5a6268; }

    /* 模式切換按鈕 */
    .mode-switch { display: flex; gap: 10px; margin-bottom: 15px; }
    .mode-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: 2px solid #0d6efd; border-radius: 8px; background: white; color: #0d6efd; cursor: pointer; transition: 0.2s; }
    .mode-btn.active-borrow { background: #0d6efd; color: white; }
    .mode-btn.active-return { background: #198754; border-color: #198754; color: white; }

    #camera-select { margin-bottom: 15px; padding: 8px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; width: 100%; }
    #reader { width: 100%; background: black; border-radius: 8px; overflow: hidden; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; white-space: pre-wrap; line-height: 1.5; min-height: 60px; padding: 10px; border-radius: 6px; background: #f1f3f5; }

    /* Modal 彈窗樣式 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 90%; max-width: 600px; height: 80vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
    .modal-header { padding: 12px 20px; background: #f1f3f5; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
    .modal-header h3 { margin: 0; font-size: 18px; color: #333; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; }
    .modal-body { flex: 1; padding: 0; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="top-actions">
    <h2>📷 設備掃描借還</h2>
    <!-- 查看清單按鈕 -->
    <button class="nav-btn" onclick="openListModal()">📋 查看借出清單</button>
  </div>

  <!-- 模式選擇 -->
  <div class="mode-switch">
    <button id="btn-borrow" class="mode-btn active-borrow" onclick="setMode('borrow')">📤 設備借用</button>
    <button id="btn-return" class="mode-btn" onclick="setMode('return')">📥 設備歸還</button>
  </div>

  <!-- 相機選單 -->
  <select id="camera-select"></select>

  <!-- 掃描視窗 -->
  <div id="reader"></div>

  <!-- 結果顯示 -->
  <div id="result">相機啟動中，請稍候...</div>
</div>

<!-- 清單彈窗 Modal -->
<div id="listModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📋 借出中設備清單</h3>
      <button class="close-btn" onclick="closeListModal()">&times;</button>
    </div>
    <div class="modal-body">
      <iframe id="listFrame" src=""></iframe>
    </div>
  </div>
</div>

<script>
  // ★★★ 請替換成您部署獲得的 GAS Web App 網址 ★★★
  const API_URL = "https://script.google.com/macros/s/AKfycbybSwE78Lp1uGL3esjAjIyYrEHjb2NCoHLT0FUliTDVhfTYFKmWea_YqQHDECsRYeI1/exec";

  let currentMode = 'borrow';
  let isProcessing = false;
  const html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };
  const cameraSelect = document.getElementById('camera-select');
  const resultDiv = document.getElementById('result');

  // 切換借用 / 歸還模式
  function setMode(mode) {
    currentMode = mode;
    const btnBorrow = document.getElementById('btn-borrow');
    const btnReturn = document.getElementById('btn-return');

    if (mode === 'borrow') {
      btnBorrow.className = 'mode-btn active-borrow';
      btnReturn.className = 'mode-btn';
    } else {
      btnBorrow.className = 'mode-btn';
      btnReturn.className = 'mode-btn active-return';
    }
  }

  // 開啟清單彈窗
  function openListModal() {
    const listFrame = document.getElementById('listFrame');
    // 透過 URL 帶入 ?page=list 參數載入 List.html
    listFrame.src = `${API_URL}?page=list`;
    document.getElementById('listModal').style.display = 'flex';
  }

  // 關閉清單彈窗
  function closeListModal() {
    document.getElementById('listModal').style.display = 'none';
    document.getElementById('listFrame').src = ''; // 清空以節省記憶體
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    if (decodedText.includes("text=")) {
      decodedText = decodedText.split("text=")[1].split("&")[0];
    }

    const actionText = currentMode === 'borrow' ? '借用' : '歸還';
    resultDiv.style.color = "#0056b3";
    resultDiv.innerText = `讀取到編號：${decodedText}\n正在處理${actionText}中...`;

    fetch(`${API_URL}?id=${encodeURIComponent(decodedText)}&action=${currentMode}`)
      .then(response => response.text())
      .then(text => {
        resultDiv.style.color = text.includes("成功") ? "green" : "red";
        resultDiv.innerText = text;

        setTimeout(() => {
          isProcessing = false;
          resultDiv.style.color = "#333";
          resultDiv.innerText = "請對準下一個 QR Code 進行掃描...";
        }, 3500);
      })
      .catch(error => {
        resultDiv.style.color = "red";
        resultDiv.innerText = "系統連線錯誤！";
        setTimeout(() => { isProcessing = false; }, 3500);
      });
  }

  function startCamera(cameraId) {
    html5QrCode.start(cameraId, config, onScanSuccess)
      .then(() => { resultDiv.innerText = "請對準 QR Code 進行掃描..."; })
      .catch(err => { console.error(err); });
  }

  Html5Qrcode.getCameras().then(devices => {
    if (devices && devices.length) {
      devices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.id;
        option.text = device.label || `相機 ${index + 1}`;
        cameraSelect.appendChild(option);
      });

      startCamera(cameraSelect.value);

      cameraSelect.addEventListener('change', () => {
        html5QrCode.stop().then(() => {
          startCamera(cameraSelect.value);
        }).catch(err => console.error("切換鏡頭失敗", err));
      });
    }
  }).catch(err => {
    resultDiv.innerText = "無法取得相機權限，請確認瀏覽器授權。";
  });
</script>

</body>
</html>
