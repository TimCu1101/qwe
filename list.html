<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>借出中設備清單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; }
    .loading { text-align: center; font-size: 16px; color: #666; margin-top: 30px; }
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; min-width: 400px; }
    th, td { border: 1px solid #dee2e6; padding: 10px 8px; text-align: left; white-space: nowrap; }
    th { background-color: #0d6efd; color: white; position: sticky; top: 0; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    .badge-borrowed { background-color: #dc3545; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; display: inline-block; }
  </style>
</head>
<body>

  <div id="loading" class="loading">⏳ 正在載入借出中清單...</div>
  <div id="table-container" class="table-wrapper"></div>

  <script>
    window.onload = function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(renderTable)
          .withFailureHandler(showError)
          .getBorrowedData();
      } else {
        document.getElementById('loading').innerText = "環境錯誤：非 GAS 環境執行。";
      }
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderTable(data) {
      const loading = document.getElementById('loading');
      const container = document.getElementById('table-container');

      if (!data || data.length <= 1) {
        loading.innerText = "🎉 目前沒有借出中的設備！";
        return;
      }

      loading.style.display = 'none';

      let html = '<table><thead><tr>';
      data[0].forEach(header => {
        html += `<th>${escapeHtml(header)}</th>`;
      });
      html += '</tr></thead><tbody>';

      for (let i = 1; i < data.length; i++) {
        html += '<tr>';
        data[i].forEach((cell, index) => {
          const safeCell = escapeHtml(cell);
          if (index === 2) {
            html += `<td><span class="badge-borrowed">${safeCell}</span></td>`;
          } else {
            html += `<td>${safeCell}</td>`;
          }
        });
        html += '</tr>';
      }

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function showError(err) {
      document.getElementById('loading').innerText = "載入失敗：" + (err.message || err);
    }
  </script>
</body>
</html>
