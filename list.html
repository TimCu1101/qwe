<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>借出中設備清單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; text-align: center; color: #333; }

    .nav-bar { display: flex; justify-content: space-around; background: #e9ecef; padding: 8px; border-radius: 8px; margin-bottom: 20px; }
    .nav-link { text-decoration: none; color: #495057; font-weight: bold; padding: 8px 16px; border-radius: 6px; }
    .nav-link.active { background: #0d6efd; color: white; }

    .refresh-btn { width: 100%; padding: 10px; margin-bottom: 15px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
    th { background-color: #f1f3f4; font-weight: 600; white-space: nowrap; }
    .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; background-color: #fce8e6; color: #c5221f; font-size: 0.85em; font-weight: bold; }
    .empty-msg, .loading-msg { text-align: center; color: #666; padding: 20px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>📋 借出中設備清單</h2>

  <div class="nav-bar">
    <a href="?page=index" target="_top" class="nav-link">📷 掃描借還</a>
    <a href="?page=list" target="_top" class="nav-link active">📋 借出中清單</a>
  </div>

  <button class="refresh-btn" onclick="fetchBorrowedData()">🔄 重整清單資料</button>

  <div id="list-container">
    <div class="loading-msg">資料載入中...</div>
  </div>
</div>

<script>
  window.onload = function() {
    fetchBorrowedData();
  };

  function fetchBorrowedData() {
    const container = document.getElementById('list-container');
    container.innerHTML = '<div class="loading-msg">資料載入中...</div>';

    google.script.run
      .withSuccessHandler(renderBorrowedTable)
      .withFailureHandler(err => {
        container.innerHTML = '<div class="empty-msg" style="color:red;">載入失敗：' + escapeHtml(err.message) + '</div>';
      })
      .getBorrowedData();
  }

  function renderBorrowedTable(data) {
    const container = document.getElementById('list-container');

    if (!data || data.length <= 1) {
      container.innerHTML = '<div class="empty-msg">目前沒有任何借出中的設備。</div>';
      return;
    }

    let html = '<div class="table-responsive"><table><thead><tr>';
    
    data[0].forEach(header => {
      html += `<th>${escapeHtml(header)}</th>`;
    });
    html += '</tr></thead><tbody>';

    for (let i = 1; i < data.length; i++) {
      html += '<tr>';
      data[i].forEach((cell, cellIndex) => {
        if (cellIndex === 2) {
          html += `<td><span class="status-badge">${escapeHtml(cell)}</span></td>`;
        } else {
          html += `<td>${escapeHtml(cell)}</td>`;
        }
      });
      html += '</tr>';
    }

    html += '</tbody></table></div>';
    container.innerHTML = html;
  }

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
